<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jadwal Operasional Kedai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      
      /* Background geometris */
      background:
        linear-gradient(135deg, rgba(255,255,255,.8) 25%, transparent 25%) 0 0/140px 140px,
        linear-gradient(315deg, rgba(210,213,216,.65) 25%, transparent 25%) 0 0/160px 160px,
        linear-gradient(45deg, #eef0f2 25%, #d8dce0 25%, #d8dce0 50%, #eef0f2 50%, #eef0f2 75%, #d8dce0 75%);
      background-size: 180px 180px;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      padding: 35px 0;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .coffee {
      position: relative;
      display: inline-block;
      font-size: 105px;
      line-height: 1;
      color: #0878bd;
    }

    .steam {
      position: absolute;
      top: -40px;
      left: 35px;
      font-size: 70px;
      color: #e3262e;
      font-weight: bold;
    }

    /* Menu */
    .menu {
      text-align: center;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .menu a {
      color: #4b188f;
      text-decoration: underline;
      font-weight: bold;
    }

    hr {
      border: none;
      border-top: 1px solid #888;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 38px;
      font-weight: normal;
      margin-bottom: 70px;
    }

    /* Tabel */
    table {
      border-collapse: collapse;
      width: 310px;
      background: rgba(255,255,255,.65);
    }

    th,
    td {
      border: 1.5px solid #333;
      padding: 18px 15px;
      text-align: left;
      font-size: 22px;
      vertical-align: middle;
    }

    th {
      font-weight: normal;
    }

    .hari {
      width: 55%;
    }

    .jam {
      width: 45%;
    }

    .catatan {
      font-style: italic;
      font-size: 20px;
      line-height: 1.8;
    }

    /* Footer */
    footer {
      text-align: center;
      color: #777;
      font-size: 18px;
      margin-top: 65px;
      padding-bottom: 20px;
    }

    /* Tampilan HP */
    @media (max-width: 500px) {

 .logo {
   width: 180px;
   }

      .coffee {
        font-size: 85px;
      }

      .steam {
        font-size: 58px;
        top: -32px;
        left: 28px;
      }

      .menu {
        font-size: 17px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 55px;
      }

      table {
        width: 310px;
        max-width: 100%;
      }

      th,
      td {
        font-size: 19px;
        padding: 15px 12px;
      }

      .catatan {
        font-size: 17px;
      }

      footer {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="SY-Series.png">

  <!-- Ganti logo.png dengan nama file logo kamu -->
        <img
            src="SY-Series.png"
            alt="Logo SY Series"
            class="logo

    <!-- MENU -->
    <div class="menu">
      <a href="index.html">Beranda</a>
      |
      <a href="#jadwal">Jadwal Operasional</a>
    </div>

    <hr>

    <!-- JUDUL -->
    <h1 id="jadwal">Jam Operasional</h1>

    <!-- TABEL -->
    <table>

      <tr>
        <th class="hari">Hari</th>
        <th class="jam">Jam Buka</th>
      </tr>

      <tr>
        <td>
          Senin -<br>
          Jumat
        </td>

        <td>
          09.00 -<br>
          22.00
        </td>
      </tr>

      <tr>
        <td>
          Sabtu -<br>
          Minggu
        </td>

        <td>
          10.00 -<br>
          24.00
        </td>
      </tr>

      <tr>
        <td colspan="2" class="catatan">
          Format waktu dalam<br>
          WIB
        </td>
      </tr>

    </table>

    <!-- FOOTER -->
    <footer>
      Created by Satrya Yanuar Wiguna @2026
    </footer>

  </div>

</body>
</html>
